<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Fivem by.tovix</title>
    <link rel="icon" type="image/png" href="https://ibb.co/DPrw17KC">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Chakra Petch', sans-serif; 
            background-color: #020203; 
            height: 100vh;
            overflow: hidden;
        }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1f; border-radius: 4px; }
        
        .interactive-node { transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
        .interactive-node:hover { background-color: #08080c; border-color: rgba(212, 175, 55, 0.2) !important; }
        .active-node { background-color: #09090e !important; border-color: rgba(212, 175, 55, 0.3) !important; }
        
        .fade-slide-in { animation: fadeSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeSlide { from { opacity: 0; transform: scale(0.99) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="text-stone-400 antialiased flex flex-col h-screen">

    <header class="h-14 border-b border-stone-900/60 px-6 flex items-center justify-between flex-shrink-0 bg-[#040406]">
        <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-[#d4af37]"></span>
            <span class="text-xs font-medium text-white tracking-[0.25em] uppercase">Check Fivem</span>
        </div>
        <div id="count_num" class="text-[10px] text-stone-500 font-medium tracking-widest uppercase">
            0
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <section class="w-80 lg:w-96 border-r border-stone-900/60 flex flex-col bg-[#040406] flex-shrink-0">
            <div class="p-5 border-b border-stone-900/40 space-y-4">
                <div>
                    <label class="text-[9px] text-stone-600 uppercase tracking-widest font-medium block mb-1.5">Network Server Entry</label>
                    <div class="flex gap-2 bg-[#000000] border border-stone-900 p-1 rounded-xl">
                        <input type="text" id="server_ip" placeholder="IP:PORT Address" 
                            class="flex-1 bg-transparent px-3 py-1.5 text-xs tracking-wider outline-none text-white placeholder-stone-800">
                        <button onclick="loadPlayers()" class="bg-white hover:bg-stone-200 text-black text-[10px] uppercase tracking-widest px-4 py-1.5 rounded-lg font-medium transition-all flex items-center justify-center flex-shrink-0">
                            Fetch
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-[9px] text-stone-600 uppercase tracking-widest font-medium block mb-1.5"></label>
                    <div class="relative">
                        <i class="fa-solid fa-cube absolute left-3 top-2.5 text-stone-800 text-[11px]"></i>
                        <input type="text" id="search_input" onkeyup="filterPlayers()" placeholder="Search Identity / Unique ID" 
                            class="w-full bg-[#000000] border border-stone-900 rounded-lg pl-9 pr-4 py-1.5 outline-none text-xs text-stone-300 placeholder-stone-800 tracking-wide">
                    </div>
                </div>
            </div>

            <div class="px-5 py-2.5 text-[9px] text-stone-500 tracking-[0.2em] uppercase border-b border-stone-900/40 bg-[#000000]/10">
                Live Server Ledger
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1" id="player_sidebar">
                <div class="flex flex-col items-center justify-center py-36 text-center px-6 opacity-30">
                    <i class="fa-light fa-fingerprint text-stone-700 text-2xl mb-2"></i>
                    <p class="text-[10px] uppercase tracking-widest text-stone-600">Awaiting Entry</p>
                </div>
            </div>
        </section>

        <main id="player_detail" class="flex-1 bg-[#010102] overflow-y-auto custom-scroll flex items-center justify-center p-12">
            <div class="text-center max-w-xs opacity-20">
                <div class="w-8 h-8 border border-stone-900 rounded-full flex items-center justify-center text-stone-600 text-xs mx-auto mb-3">
                    <i class="fa-solid fa-plus-minus"></i>
                </div>
                <h2 class="text-[10px] font-medium text-white uppercase tracking-[0.25em] mb-1">Null Identity Selected</h2>
                <!-- <p class="text-stone-600 text-[10px] leading-relaxed"></p> -->
            </div>
        </main>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-10 opacity-0 transition-all duration-300 bg-[#040406] border border-stone-800/80 text-stone-200 px-4 py-2.5 rounded-xl shadow-2xl z-50 flex items-center gap-2.5 text-[11px] tracking-widest font-light">
        <span class="w-1 h-1 rounded-full bg-[#d4af37]"></span> SYSTEM COPIED
    </div>

    <script>
        let allPlayers = [];

        async function loadPlayers() {
            const ip = document.getElementById('server_ip').value;
            if(!ip) return;
            
            const sidebar = document.getElementById('player_sidebar');
            sidebar.innerHTML = '<div class="text-center py-24"><i class="fa-solid fa-circle-notch animate-spin text-stone-800 text-xs"></i></div>';

            const formData = new FormData();
            formData.append('server_ip', ip);

            try {
                const response = await fetch('/fetch_all', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    allPlayers = data;
                    document.getElementById('count_num').innerText = `${data.length} NODES CONNECTED`;
                    renderSidebar(allPlayers);
                    localStorage.setItem('last_ip', ip);
                } else {
                    sidebar.innerHTML = `<div class="p-4 text-stone-600 text-xs text-center">${data.error}</div>`;
                }
            } catch (e) {
                sidebar.innerHTML = `<p class="text-stone-700 p-8 text-center text-[10px] tracking-widest uppercase">BRIDGE FAULT</p>`;
            }
        }

        function renderSidebar(players) {
            const sidebar = document.getElementById('player_sidebar');
            if(players.length === 0) {
                sidebar.innerHTML = '<p class="text-center text-stone-700 py-10 text-xs tracking-wider uppercase">No Data Found</p>';
                return;
            }
            sidebar.innerHTML = players.map(p => `
                <button onclick="showDetail(${p.id}, this)" class="interactive-node w-full text-left p-3 rounded-xl flex items-center justify-between border border-transparent bg-transparent active:scale-[0.99] mb-0.5">
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="text-[10px] font-mono text-[#d4af37]/70 bg-stone-900/40 w-6 h-6 rounded flex items-center justify-center flex-shrink-0">${p.id}</span>
                        <span class="font-medium text-stone-300 text-xs truncate w-40">${p.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] text-stone-600 font-mono">${p.ping}ms</span>
                        <span class="w-1 h-1 rounded-full ${p.ping < 60 ? 'bg-emerald-500/60' : 'bg-amber-500/60'}"></span>
                    </div>
                </button>
            `).join('');
        }

        function filterPlayers() {
            const term = document.getElementById('search_input').value.toLowerCase();
            const filtered = allPlayers.filter(p => 
                p.name.toLowerCase().includes(term) || p.id.toString().includes(term)
            );
            renderSidebar(filtered);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
        }

        function showDetail(id, element) {
            document.querySelectorAll('.interactive-node').forEach(el => el.classList.remove('active-node'));
            if(element) element.classList.add('active-node');

            const p = allPlayers.find(x => x.id == id);
            const detailView = document.getElementById('player_detail');
            
            const avatarImg = p.discord 
                ? `https://img.lany.io/discord/avatars/${p.discord}?size=256` 
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=040406&color=ffffff&bold=false`;

            detailView.classList.remove('items-center', 'justify-center');
            detailView.innerHTML = `
                <div class="max-w-5xl w-full fade-slide-in space-y-8 self-start">
                    
                    <!-- MASTER INFRASTRUCTURE HEADER -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-stone-900/60 pb-6">
                        <div class="flex items-center gap-5">
                            <img src="${avatarImg}" class="w-14 h-14 rounded-2xl border border-stone-900 bg-[#040406] object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${p.name}'">
                            <div>
                                <div class="flex items-center gap-3">
                                    <h2 class="text-2xl font-light text-white tracking-wide uppercase">${p.name}</h2>
                                    <span class="text-[9px] tracking-widest text-[#d4af37] border border-[#d4af37]/20 bg-[#d4af37]/5 px-2 py-0.5 rounded uppercase">ACTIVE IDENTITY</span>
                                </div>
                                <p class="text-[10px] text-stone-600 tracking-widest uppercase mt-1 font-mono">${p.endpoint}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-stone-500 text-[10px] block tracking-widest uppercase font-mono mb-1">REGISTERED INDEX</span>
                            <span class="text-xl font-light font-mono text-white bg-[#040406] border border-stone-900 px-4 py-1 rounded-xl"># ${p.id}</span>
                        </div>
                    </div>

                    <!-- MODULAR DASHBOARD GRID -->
                    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        
                        <!-- Block 1: Security Identifiers (2-Column Scale) -->
                        <div class="xl:col-span-2 space-y-4">
                            <h3 class="text-stone-600 text-[10px] font-medium uppercase tracking-[0.25em]">Cryptographic Keys</h3>
                            
                            <div class="bg-[#040406] p-4 rounded-xl border border-stone-900 flex items-center justify-between gap-4">
                                <div class="min-w-0 flex items-center gap-3.5">
                                    <div class="w-8 h-8 rounded-lg bg-stone-950 border border-stone-900 flex items-center justify-center text-stone-600"><i class="fa-brands fa-discord text-base"></i></div>
                                    <div class="min-w-0">
                                        <p class="text-[8px] text-stone-600 font-medium uppercase tracking-wider mb-0.5">Discord ID Token</p>
                                        <p class="text-xs text-stone-300 font-mono truncate tracking-wide">${p.discord || 'Null / Not bound'}</p>
                                    </div>
                                </div>
                                ${p.discord ? `<button onclick="copyToClipboard('${p.discord}')" class="text-stone-600 hover:text-white p-2 transition-all"><i class="fa-regular fa-clone text-xs"></i></button>` : ''}
                            </div>

                            <div class="bg-[#040406] p-4 rounded-xl border border-stone-900 flex items-center justify-between gap-4">
                                <div class="min-w-0 flex items-center gap-3.5">
                                    <div class="w-8 h-8 rounded-lg bg-stone-950 border border-stone-900 flex items-center justify-center text-stone-600"><i class="fa-brands fa-steam text-base"></i></div>
                                    <div class="min-w-0">
                                        <p class="text-[8px] text-stone-600 font-medium uppercase tracking-wider mb-0.5">Steam Meta Signature</p>
                                        <p class="text-xs text-stone-400 font-mono truncate tracking-wide">${p.steam_id64 || 'No Active Handle'}</p>
                                    </div>
                                </div>
                                ${p.steam ? `<a href="${p.steam}" target="_blank" class="text-stone-600 hover:text-stone-400 p-2 transition-all"><i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i></a>` : ''}
                            </div>
                        </div>

                        <!-- Block 2: Telemetry Performance Summary (1-Column Scale) -->
                        <div class="space-y-4">
                            <h3 class="text-stone-600 text-[10px] font-medium uppercase tracking-[0.25em]">Telemetry Metrics</h3>
                            
                            <div class="bg-[#040406] border border-stone-900 rounded-xl p-5 flex flex-col justify-between h-[154px]">
                                <div class="flex items-center justify-between">
                                    <span class="text-stone-600 text-[9px] uppercase tracking-widest font-mono">Ping Signal</span>
                                    <span class="text-[9px] tracking-widest uppercase text-stone-400 font-medium">${p.ping < 60 ? 'Stable Path' : 'High Delay'}</span>
                                </div>
                                <div class="my-auto flex items-baseline gap-1">
                                    <span class="text-4xl font-light font-mono text-white tracking-tighter">${p.ping}</span>
                                    <span class="text-[11px] text-stone-600 font-mono uppercase">ms</span>
                                </div>
                                <div class="border-t border-stone-900/80 pt-3 flex justify-between items-center">
                                    <span class="text-[9px] text-stone-600 uppercase tracking-widest">Routing Status</span>
                                    <div class="flex items-center gap-1.5 text-[10px] font-medium uppercase text-stone-300">
                                        <span class="w-1 h-1 rounded-full ${p.ping < 60 ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                                        ${p.ping < 60 ? 'Excellent' : 'Normal'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            const savedIp = localStorage.getItem('last_ip');
            if(savedIp) document.getElementById('server_ip').value = savedIp;
        }
    </script>
</body>
</html>
